[project]
name = "threatpipe"
version = "0.2.0"
description = "Multi-vendor CTI MCP servers for Claude Desktop — all credentials from Azure Key Vault"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "azure-identity>=1.17.0",
    "azure-keyvault-secrets>=4.8.0",
    "claude-agent-sdk>=0.2.150",
    "anthropic[bedrock]>=1.3.0",
]

[project.scripts]
cti-feeds-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
